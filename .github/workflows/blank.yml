name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Prepare and Build APK
      run: |
        # 1. إنشاء ملف gradlew تلقائياً في حال عدم وجوده وضبط الصلاحيات
        if [ ! -f "gradlew" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper
        fi
        chmod +x gradlew

        # 2. ترتيب الملفات المرفوعة في مجلد واحد تلقائياً لهيكل أندرويد
        if [ ! -d "app/src/main" ]; then
          echo "Organizing files into Android build structure..."
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/{core/security,core/util,core/notifications,data/model,data/local/entity,data/local/dao,data/local/database,data/local/datastore,domain/provider/official,domain/provider/assisted,domain/provider/mock,domain/repository,domain/usecase,domain/scheduler,work,ui/theme,ui}
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/test/java/dz/mesrs/webetu/automeals

          # نسخ ملفات الكود
          cp -f *MainActivity*.kt app/src/main/java/dz/mesrs/webetu/automeals/ui/MainActivity.kt 2>/dev/null || true
          cp -f *Theme*.kt app/src/main/java/dz/mesrs/webetu/automeals/ui/theme/Theme.kt 2>/dev/null || true
          cp -f *App.kt app/src/main/java/dz/mesrs/webetu/automeals/WebetuAutoMealsApp.kt 2>/dev/null || true
          cp -f *Keystore*.kt app/src/main/java/dz/mesrs/webetu/automeals/core/security/KeystoreSecretManager.kt 2>/dev/null || true
          cp -f *SecurityAudit*.kt app/src/main/java/dz/mesrs/webetu/automeals/core/security/SecurityAudit.kt 2>/dev/null || true
          cp -f *TimeUtils*.kt app/src/main/java/dz/mesrs/webetu/automeals/core/util/TimeUtils.kt 2>/dev/null || true
          cp -f *Result*.kt app/src/main/java/dz/mesrs/webetu/automeals/core/util/Result.kt 2>/dev/null || true
          cp -f *Notification*.kt app/src/main/java/dz/mesrs/webetu/automeals/core/notifications/MealNotificationManager.kt 2>/dev/null || true
          cp -f *Enums*.kt app/src/main/java/dz/mesrs/webetu/automeals/data/model/Enums.kt 2>/dev/null || true
          cp -f *ScheduleSettings*.kt app/src/main/java/dz/mesrs/webetu/automeals/data/model/ScheduleSettings.kt 2>/dev/null || true
          cp -f *Entity*.kt app/src/main/java/dz/mesrs/webetu/automeals/data/local/entity/BookingAttemptEntity.kt 2>/dev/null || true
          cp -f *Dao*.kt app/src/main/java/dz/mesrs/webetu/automeals/data/local/dao/BookingAttemptDao.kt 2>/dev/null || true
          cp -f *Database*.kt app/src/main/java/dz/mesrs/webetu/automeals/data/local/database/AppDatabase.kt 2>/dev/null || true
          cp -f *DataStore*.kt app/src/main/java/dz/mesrs/webetu/automeals/data/local/datastore/SchedulePreferencesDataStore.kt 2>/dev/null || true
          cp -f *Official*.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/provider/official/OfficialIntegrationProvider.kt 2>/dev/null || true
          cp -f *Assisted*.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/provider/assisted/AssistedBookingProvider.kt 2>/dev/null || true
          cp -f *Mock*.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/provider/mock/MockMealBookingProvider.kt 2>/dev/null || true
          cp -f *MealBookingProvider*.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/provider/MealBookingProvider.kt 2>/dev/null || true
          cp -f *BookingRepository*.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/repository/BookingRepository.kt 2>/dev/null || true
          cp -f *ScheduleSettingsRepository*.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/repository/ScheduleSettingsRepository.kt 2>/dev/null || true
          cp -f *UseCases*.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/usecase/UseCases.kt 2>/dev/null || true
          cp -f *SchedulingManager*.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/scheduler/MealSchedulingManager.kt 2>/dev/null || true
          cp -f *Worker*.kt app/src/main/java/dz/mesrs/webetu/automeals/work/MealBookingWorker.kt 2>/dev/null || true
          cp -f *Receiver*.kt app/src/main/java/dz/mesrs/webetu/automeals/work/BootReceiver.kt 2>/dev/null || true
          cp -f *Test*.kt app/src/test/java/dz/mesrs/webetu/automeals/AllTests.kt 2>/dev/null || true

          # نسخ الموارد والبيان وملف البناء
          cp -f *AndroidManifest*.xml app/src/main/AndroidManifest.xml 2>/dev/null || true
          cp -f *colors*.xml app/src/main/res/values/colors.xml 2>/dev/null || true
          cp -f *strings*.xml app/src/main/res/values/strings.xml 2>/dev/null || true
          cp -f *themes*.xml app/src/main/res/values/themes.xml 2>/dev/null || true
          cp -f *ic_launcher*.xml app/src/main/res/drawable/ic_launcher_foreground.xml 2>/dev/null || true
          cp -f *ic_launcher*.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml 2>/dev/null || true
          cp -f *app-build*.gradle.kts app/build.gradle.kts 2>/dev/null || cp -f *build.gradle.kts app/build.gradle.kts 2>/dev/null || true
        fi

        # 3. بناء وتجميع حزمة الـ APK
        ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WebetuAutoMeals-debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
