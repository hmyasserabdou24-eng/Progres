name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project layout and fix sources
        run: |
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/core/security
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/core/util
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/core/notifications
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/data/model
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/data/local/entity
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/data/local/dao
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/data/local/database
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/data/local/datastore
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/domain/provider/official
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/domain/provider/assisted
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/domain/provider/mock
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/domain/repository
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/domain/usecase
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/domain/scheduler
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/work
          mkdir -p app/src/main/java/dz/mesrs/webetu/automeals/ui/theme
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/test/java/dz/mesrs/webetu/automeals

          cp -f app-build.gradle.kts app/build.gradle.kts
          cp -f proguard-rules.pro app/proguard-rules.pro
          cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp -f colors.xml app/src/main/res/values/colors.xml
          cp -f strings.xml app/src/main/res/values/strings.xml
          cp -f themes.xml app/src/main/res/values/themes.xml
          cp -f ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher_foreground.xml
          cp -f ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml 2>/dev/null || true
          cp -f ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml 2>/dev/null || true

          cp -f MainActivity.kt app/src/main/java/dz/mesrs/webetu/automeals/ui/MainActivity.kt
          cp -f Theme.kt app/src/main/java/dz/mesrs/webetu/automeals/ui/theme/Theme.kt
          cp -f WebetuAutoMealsApp.kt app/src/main/java/dz/mesrs/webetu/automeals/WebetuAutoMealsApp.kt
          cp -f KeystoreSecretManager.kt app/src/main/java/dz/mesrs/webetu/automeals/core/security/KeystoreSecretManager.kt
          cp -f SecurityAudit.kt app/src/main/java/dz/mesrs/webetu/automeals/core/security/SecurityAudit.kt
          cp -f TimeUtils.kt app/src/main/java/dz/mesrs/webetu/automeals/core/util/TimeUtils.kt
          cp -f Result.kt app/src/main/java/dz/mesrs/webetu/automeals/core/util/Result.kt
          cp -f MealNotificationManager.kt app/src/main/java/dz/mesrs/webetu/automeals/core/notifications/MealNotificationManager.kt
          cp -f Enums.kt app/src/main/java/dz/mesrs/webetu/automeals/data/model/Enums.kt
          cp -f ScheduleSettings.kt app/src/main/java/dz/mesrs/webetu/automeals/data/model/ScheduleSettings.kt
          cp -f BookingAttemptEntity.kt app/src/main/java/dz/mesrs/webetu/automeals/data/local/entity/BookingAttemptEntity.kt
          cp -f BookingAttemptDao.kt app/src/main/java/dz/mesrs/webetu/automeals/data/local/dao/BookingAttemptDao.kt
          cp -f AppDatabase.kt app/src/main/java/dz/mesrs/webetu/automeals/data/local/database/AppDatabase.kt
          cp -f SchedulePreferencesDataStore.kt app/src/main/java/dz/mesrs/webetu/automeals/data/local/datastore/SchedulePreferencesDataStore.kt
          cp -f OfficialIntegrationProvider.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/provider/official/OfficialIntegrationProvider.kt
          cp -f AssistedBookingProvider.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/provider/assisted/AssistedBookingProvider.kt
          cp -f MockMealBookingProvider.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/provider/mock/MockMealBookingProvider.kt
          cp -f MealBookingProvider.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/provider/MealBookingProvider.kt
          cp -f BookingRepository.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/repository/BookingRepository.kt
          cp -f ScheduleSettingsRepository.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/repository/ScheduleSettingsRepository.kt
          cp -f UseCases.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/usecase/UseCases.kt
          cp -f MealSchedulingManager.kt app/src/main/java/dz/mesrs/webetu/automeals/domain/scheduler/MealSchedulingManager.kt
          cp -f MealBookingWorker.kt app/src/main/java/dz/mesrs/webetu/automeals/work/MealBookingWorker.kt
          cp -f BootReceiver.kt app/src/main/java/dz/mesrs/webetu/automeals/work/BootReceiver.kt
          cp -f AllTests.kt app/src/test/java/dz/mesrs/webetu/automeals/AllTests.kt

          if grep -q "MainViewModel" app/src/main/java/dz/mesrs/webetu/automeals/ui/MainActivity.kt 2>/dev/null; then
            cp -f MainViewModel.kt app/src/main/java/dz/mesrs/webetu/automeals/ui/MainViewModel.kt 2>/dev/null || true
            cp -f MainScreens.kt app/src/main/java/dz/mesrs/webetu/automeals/ui/MainScreens.kt 2>/dev/null || true
          fi

          sed -i 's/; private set//g' app/src/main/java/dz/mesrs/webetu/automeals/WebetuAutoMealsApp.kt
          sed -i 's/@mipmap\/ic_launcher_round/@drawable\/ic_launcher_foreground/g; s/@mipmap\/ic_launcher/@drawable\/ic_launcher_foreground/g' app/src/main/AndroidManifest.xml
          sed -i 's/\["/\[\\"/g; s/\[^"/\[^\\"/g' app/src/main/java/dz/mesrs/webetu/automeals/core/security/SecurityAudit.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install SDK 34
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebetuAutoMeals-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
